<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="144" y1="80" x2="876" y2="944" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C86FF"/>
      <stop offset="1" stop-color="#3F4CCF"/>
    </linearGradient>
    <!-- A soft band of light along the very top of the tile, as if the surface
         itself catches light from above — the same "raised" language every
         other tactile surface in the app uses, just applied to the icon. -->
    <linearGradient id="topHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="markShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1E2470" flood-opacity=".28"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" rx="232" fill="url(#background)"/>
  <!-- Inner top highlight: a rounded-rect stroke just inside the tile edge,
       fading out by mid-height, so the icon reads as a poured, lit surface
       rather than a flat color swatch. -->
  <rect x="24" y="24" width="976" height="976" rx="208" fill="none" stroke="url(#topHighlight)" stroke-width="16"/>
  <g filter="url(#markShadow)">
    <circle cx="512" cy="492" r="284" fill="none" stroke="#FFFFFF" stroke-opacity=".2" stroke-width="48"/>
    <path d="M636 664l116 116" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-width="76"/>
    <path d="M600 604c-26 26-60 40-102 40-98 0-170-74-170-180s72-180 170-180 170 74 170 180c0 32-6 60-18 84" fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="76"/>
  </g>
</svg>
