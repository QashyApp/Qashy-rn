name: Build

# Android builds only. Nothing here depends on the Test workflow.
#   push to main      -> preview APK (the only automatic build)
#   manual dispatch   -> whichever buildType you pick (dev/preview/production/all)
#   tags              -> never build
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
      - "e2e/**"
      - "scripts/**"
      - ".github/dependabot.yml"
      - ".github/workflows/test.yml"
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - dev
          - preview
          - production
          - all

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      preview: ${{ steps.plan.outputs.preview }}
    steps:
      - name: 🗺 Plan builds
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BUILD_TYPE: ${{ github.event.inputs.buildType }}
        run: |
          dev='{"name":"dev","profile":"development","prefix":"qashy-dev","ext":"apk","node_env":"development"}'
          preview='{"name":"preview","profile":"preview","prefix":"qashy-release","ext":"apk","node_env":"production"}'
          production='{"name":"production","profile":"production","prefix":"qashy-release","ext":"aab","node_env":"production"}'

          # "true" when the matrix contains the preview build (smoke test runs on its APK).
          has_preview=true

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$BUILD_TYPE" in
              dev) list="$dev"; has_preview=false ;;
              preview) list="$preview" ;;
              production) list="$production"; has_preview=false ;;
              *) list="$dev,$preview,$production" ;;
            esac
          else
            list="$preview"
          fi

          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"
          echo "preview=$has_preview" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: build (${{ matrix.name }})
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # No npm cache here: `npm ci` is quick and each matrix job would otherwise
      # write its own copy.
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: 🏗 Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      # Only runs on main may write the Gradle cache (~1.7 GB per set); runs from
      # other branches read it but never add to it.
      - name: 🏗 Setup Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: 🏗 Setup EAS CLI
        uses: expo/expo-github-action@9da89d3617bb88139671bad31b09c65714c2ee06 # v9
        with:
          eas-version: 24.x
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      # The version is the static `version` in app.json.
      - name: 🏷 Name build output
        id: out
        env:
          PREFIX: ${{ matrix.prefix }}
          EXT: ${{ matrix.ext }}
        run: |
          version=$(npx expo config --json | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
          echo "name=${PREFIX}-${version}" >> "$GITHUB_OUTPUT"
          echo "file=${PREFIX}-${version}.${EXT}" >> "$GITHUB_OUTPUT"

      - name: 📱 Build ${{ matrix.name }}
        env:
          NODE_ENV: ${{ matrix.node_env }}
          PROFILE: ${{ matrix.profile }}
          OUTPUT_FILE: ${{ steps.out.outputs.file }}
        run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          eas build --platform android --profile "$PROFILE" --local --non-interactive --output="./$OUTPUT_FILE"

      - name: 📦 Upload build artifact to GitHub
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ./${{ steps.out.outputs.file }}
          archive: false
          retention-days: 7

  # Launches the exact preview APK users install (it contains an x86_64 build) on an
  # emulator. Skipped when no preview build ran or the build failed.
  smoke:
    name: smoke (preview)
    needs: [plan, build]
    if: needs.plan.outputs.preview == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The preview artifact is the bare APK, named qashy-release-<version>.apk. The
      # production AAB shares the prefix but not the extension, and the dev build is
      # qashy-dev-*, so this pattern selects only the preview APK.
      - name: 📥 Download preview APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: qashy-release-*.apk
          path: ${{ runner.temp }}/preview

      - name: 🔎 Locate APK
        run: |
          apk=$(find "$RUNNER_TEMP/preview" -name '*.apk' | head -n 1)
          if [ -z "$apk" ]; then
            echo "No preview APK was downloaded" >&2
            find "$RUNNER_TEMP/preview" >&2
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/app.apk"

      - name: ⚙ Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🧪 Smoke test on emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          disable-spellchecker: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash scripts/android-smoke-test.sh ${{ runner.temp }}/app.apk

      - name: 📦 Upload smoke test artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: smoke-test-preview
          path: |
            smoke-*.png
            smoke-logcat.txt
          if-no-files-found: warn
          retention-days: 7
