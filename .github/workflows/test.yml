name: Test

on:
  # Pull requests are the gate, so pushes only cover main. Running on dev pushes
  # as well would test every commit twice once a dev -> main PR is open.
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  # No paths-ignore here: a skipped workflow leaves required checks pending
  # forever, which would block docs-only pull requests from merging.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck, lint, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Only this job writes an npm cache; the others install without one so the
      # repository does not accumulate a ~270 MB copy per job per branch.
      - name: 🏗 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Typecheck
        run: npm run typecheck

      - name: 🧹 ESLint
        run: npm run lint

      - name: 🎨 Prettier
        run: npm run format:check

      - name: 🧪 Unit tests
        run: npm test

  native-bundle:
    name: native bundling (iOS + Android)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📱 Export iOS bundle
        run: npx expo export -p ios --output-dir "$RUNNER_TEMP/qashy-ios-export"

      - name: 📱 Export Android bundle
        run: npx expo export -p android --output-dir "$RUNNER_TEMP/qashy-android-export"

  web:
    name: web build + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: 📦 Install dependencies
        run: npm ci

      # Browsers are downloaded each run rather than cached: they are several
      # hundred MB and would crowd out the rest of the repository cache.
      - name: 🌐 Install Playwright browsers
        run: npx playwright install --with-deps chromium webkit

      # playwright.config.ts builds the web export itself before serving it.
      - name: 🧪 Web tests
        run: npm run test:web

      - name: 📦 Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
