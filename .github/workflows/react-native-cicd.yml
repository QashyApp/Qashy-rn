name: React Native CI/CD

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - dev
          - preview
          - production
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
  NODE_OPTIONS: --openssl-legacy-provider

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run TypeScript check
        run: npx tsc

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🎨 Run Prettier check
        run: npm run format:check

      # Dev + preview APK on every push to main; production added for tag pushes.
      # Manual runs pick builds from the buildType input.
      - name: 🗺 Plan builds
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUILD_TYPE: ${{ github.event.inputs.buildType }}
        run: |
          dev='{"name":"dev","profile":"development","file":"app-dev.apk","node_env":"development"}'
          preview='{"name":"preview","profile":"preview","file":"app-preview.apk","node_env":"production"}'
          production='{"name":"production","profile":"production","file":"app-prod.aab","node_env":"production"}'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$BUILD_TYPE" in
              dev) list="$dev" ;;
              preview) list="$preview" ;;
              production) list="$production" ;;
              *) list="$dev,$preview,$production" ;;
            esac
          elif [[ "$REF" == refs/tags/* ]]; then
            list="$dev,$preview,$production"
          elif [ "$EVENT" = "push" ]; then
            list="$dev,$preview"
          else
            list=""
          fi

          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v4

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: 🏗 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: 🏗 Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🏗 Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 24.x
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📋 Fix package.json main entry
        run: |
          # Check if jq is installed, if not install it
          if ! command -v jq &> /dev/null; then
            echo "Installing jq..."
            sudo apt-get update && sudo apt-get install -y jq
          fi

          # Fix the main entry in package.json
          if [ -f ./package.json ]; then
            # Create a backup
            cp package.json package.json.bak
            # Update the package.json
            jq '.main = "node_modules/expo/AppEntry.js"' package.json > package.json.tmp && mv package.json.tmp package.json
            echo "Updated package.json main entry"
            cat package.json | grep "main"
          else
            echo "package.json not found"
            exit 1
          fi

      - name: 📋 Update metro.config.js for SVG support
        run: |
          if [ -f ./metro.config.js ]; then
            echo "Creating backup of metro.config.js"
            cp ./metro.config.js ./metro.config.js.backup
            echo "Updating metro.config.js to CommonJS format"
            cat > ./metro.config.js << 'EOFMARKER'
          /* eslint-disable @typescript-eslint/no-var-requires */
          const { getDefaultConfig } = require('expo/metro-config');

          const config = getDefaultConfig(__dirname);

          const { transformer, resolver } = config;

          config.transformer = {
            ...transformer,
            babelTransformerPath: require.resolve('react-native-svg-transformer/expo'),
          };

          config.resolver = {
            ...resolver,
            assetExts: resolver.assetExts.filter(ext => ext !== 'svg'),
            sourceExts: [...resolver.sourceExts, 'svg'],
          };

          module.exports = config;
          EOFMARKER
            echo "metro.config.js updated to CommonJS format"
          else
            echo "metro.config.js not found"
          fi

      - name: 📱 Build ${{ matrix.name }}
        run: |
          export NODE_OPTIONS="--openssl-legacy-provider --max_old_space_size=4096"
          eas build --platform android --profile ${{ matrix.profile }} --local --non-interactive --output=./${{ matrix.file }}
        env:
          NODE_ENV: ${{ matrix.node_env }}

      - name: 📦 Upload build artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.name }}
          path: ./${{ matrix.file }}
          retention-days: 7
