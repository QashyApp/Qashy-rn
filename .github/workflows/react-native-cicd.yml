name: React Native CI/CD

on:
  push:
    branches: [main, master, dev]
    tags: ["v*"]
    paths-ignore:
      - "**.md"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      buildType:
        type: choice
        description: "Build type to run"
        options:
          - dev
          - preview
          - production
          - all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v7

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run TypeScript check
        run: npm run typecheck

      - name: 🧹 Run ESLint
        run: npm run lint

      - name: 🎨 Run Prettier check
        run: npm run format:check

      # Pushes to dev build preview only; pushes to main/master and tags build
      # preview + production. The dev profile runs only from manual dispatch.
      # Manual runs pick builds from the buildType input.
      - name: 🗺 Plan builds
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BUILD_TYPE: ${{ github.event.inputs.buildType }}
        run: |
          dev='{"name":"dev","profile":"development","file":"app-dev.apk","node_env":"development"}'
          preview='{"name":"preview","profile":"preview","file":"app-preview.apk","node_env":"production"}'
          production='{"name":"production","profile":"production","file":"app-prod.aab","node_env":"production"}'

          if [ "$EVENT" = "workflow_dispatch" ]; then
            case "$BUILD_TYPE" in
              dev) list="$dev" ;;
              preview) list="$preview" ;;
              production) list="$production" ;;
              *) list="$dev,$preview,$production" ;;
            esac
          elif [ "$EVENT" = "push" ] && [ "$REF" = "refs/heads/dev" ]; then
            list="$preview"
          elif [ "$EVENT" = "push" ]; then
            list="$preview,$production"
          else
            list=""
          fi

          echo "matrix={\"include\":[$list]}" >> "$GITHUB_OUTPUT"

  build:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    name: build (${{ matrix.name }})
    steps:
      - name: 🏗 Checkout repository
        uses: actions/checkout@v7

      - name: 🏗 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: 🏗 Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: 🏗 Setup Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: 🏗 Setup EAS CLI
        uses: expo/expo-github-action@v9
        with:
          eas-version: 24.x
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - name: 📦 Install dependencies
        run: npm ci

      - name: 📱 Build ${{ matrix.name }}
        run: |
          export NODE_OPTIONS="--max_old_space_size=4096"
          eas build --platform android --profile ${{ matrix.profile }} --local --non-interactive --output=./${{ matrix.file }}
        env:
          NODE_ENV: ${{ matrix.node_env }}

      - name: 📦 Upload build artifact to GitHub
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ matrix.name }}
          path: ./${{ matrix.file }}
          retention-days: 7
