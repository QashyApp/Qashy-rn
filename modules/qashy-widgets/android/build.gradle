buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.qashywidgets'
version = '1.0.0'

android {
  namespace "expo.modules.qashywidgets"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    consumerProguardFiles 'consumer-rules.pro'
  }
  buildFeatures {
    compose true
  }
  lintOptions {
    abortOnError false
  }
  testOptions {
    unitTests {
      // Robolectric needs the merged resources and manifest to render the widgets.
      includeAndroidResources = true
    }
  }
}

dependencies {
  // ReactApplication / ReactHost / HeadlessJsTaskContext for the refresh worker.
  implementation 'com.facebook.react:react-android'

  // Home-screen widgets (the versions expo-widgets 58 ships with).
  implementation "androidx.glance:glance-appwidget:1.2.0"
  implementation "androidx.work:work-runtime-ktx:2.10.1"

  // Screenshot tests only (src/test; never part of the app and never run by `npm test`): they
  // render each widget's Glance content to PNGs on the JVM. See src/test/README.md.
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.robolectric:robolectric:4.16'
  testImplementation 'androidx.test:core:1.6.1'
}
